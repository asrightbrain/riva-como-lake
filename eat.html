<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bellano — Eat</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;background:#F4EFE6;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
</style>

<style>#demo-note{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#1C2620;color:#F4EFE6;font:500 11.5px/1.35 'Space Grotesk',Helvetica,Arial,sans-serif;text-align:center;padding:7px 12px}#demo-note a{text-decoration:underline}body{padding-bottom:34px}</style>
</head>
<body>
<div id="riva-root"></div>
<div id="demo-note">Prototype for feedback · demo content: texts to be verified, photos are placeholders<span id="fb"></span></div>
<template id="riva-template">


<div style="width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:#F4EFE6;font-family:'Space Grotesk',Helvetica,Arial,sans-serif;color:#1C2620;display:flex;flex-direction:column;">

  <div role="status" aria-live="polite">
    <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
      <a href="passport.html" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:440px;z-index:50;display:flex;align-items:center;gap:12px;background:#1C2620;color:#F4EFE6;border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(28,38,32,0.28);">
        <div style="flex:0 0 38px;height:38px;border-radius:999px;border:2px solid #F4EFE6;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4EFE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{toastGlyph}}"/></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(244,239,230,0.6);">New stamp</div>
          <div style="font-size:14px;font-weight:600;margin-top:1px;">{{toastTitle}}</div>
        </div>
        <div style="flex:0 0 auto;font-size:12px;color:rgba(244,239,230,0.7);">{{toastCount}}</div>
      </a>
    </sc-if>
  </div>

  <div style="position:relative;height:220px;border-radius:0 0 20px 20px;overflow:hidden;background:linear-gradient(155deg,#8A4A2E 0%,#5C2C18 60%,#3A1B0F 100%);display:flex;flex-direction:column;justify-content:space-between;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0;">
      <a href="index.html" aria-label="Back to Bellano overview" style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;background:rgba(244,239,230,0.16);color:#F4EFE6;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div style="color:rgba(244,239,230,0.6);font-size:10.5px;text-align:right;line-height:1.4;">[PHOTO<br>missoltini on the rack]</div>
    </div>
    <div style="padding:0 20px 20px;">
      <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(244,239,230,0.6);">Eat · Bellano</div>
      <div style="font-family:'Instrument Serif',Georgia,serif;font-size:34px;line-height:1;color:#F4EFE6;margin-top:4px;">What Bellano eats</div>
    </div>
  </div>

  <div style="display:flex;gap:4px;background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:4px;margin:16px 20px 4px;">
    <button type="button" style="{{pillDishesStyle}}" onClick="{{goDishes}}">Dishes</button>
    <button type="button" style="{{pillWhereStyle}}" onClick="{{goWhere}}">Where</button>
    <button type="button" style="{{pillPhotosStyle}}" onClick="{{goPhotos}}">Photos</button>
  </div>

  <div style="padding:14px 20px 32px;flex:1;">

    <sc-if value="{{tabIsDishes}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;flex-direction:column;gap:12px;">

        <p style="font-size:13.5px;line-height:1.55;margin:0 0 2px;color:rgba(28,38,32,0.7);">Six local specialities. Where we have a confirmed venue, tap the pin for directions.</p>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
                <div style="font-size:15px;font-weight:600;">Missoltini con polenta</div>
                <span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Signature</span>
              </div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Lake shad (agone), salted and sun-dried whole, then warmed and served with polenta. Salty, dense and unmistakably local.</div>
            </div>
            <span title="No confirmed venue yet" style="flex:0 0 auto;font-size:10px;font-weight:600;color:rgba(28,38,32,0.4);text-align:right;line-height:1.3;max-width:64px;">Venue to confirm</span>
          </div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="font-size:15px;font-weight:600;">Pizzoccheri tirati a mano</div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Hand-cut buckwheat tagliatelle with cabbage, potato and melted cheese — a Valtellina classic that La Darsena has served in Bellano since 1967.</div>
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Ristorante%20La%20Darsena%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" title="Ristorante La Darsena" aria-label="Get directions to Ristorante La Darsena, which serves this dish" style="flex:0 0 30px;height:30px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);display:flex;align-items:center;justify-content:center;color:#1C2620;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>
            </a>
          </div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="font-size:15px;font-weight:600;">Risotto al pesce persico</div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Rice cooked in butter and topped with pan-fried perch fillets — a staple of lake cuisine.</div>
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Trattoria%20del%20Ponte%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" title="Trattoria del Ponte" aria-label="Get directions to Trattoria del Ponte, which serves this dish" style="flex:0 0 30px;height:30px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);display:flex;align-items:center;justify-content:center;color:#1C2620;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>
            </a>
          </div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
                <div style="font-size:15px;font-weight:600;">Trippa della Pesa Vegia</div>
                <span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#C1633B;">Jan 5 festival</span>
              </div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Tripe in broth, tied to Pesa Vegia, Bellano's winter festival held every January 5 — time your visit around it to try it.</div>
            </div>
            <span title="No confirmed venue yet" style="flex:0 0 auto;font-size:10px;font-weight:600;color:rgba(28,38,32,0.4);text-align:right;line-height:1.3;max-width:64px;">Venue to confirm</span>
          </div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="font-size:15px;font-weight:600;">Miascia</div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">A very moist bread-and-cornmeal cake: stale bread soaked in milk, with apples, pears, raisins and pine nuts — a classic dolce povero.</div>
            </div>
            <span title="No confirmed venue yet" style="flex:0 0 auto;font-size:10px;font-weight:600;color:rgba(28,38,32,0.4);text-align:right;line-height:1.3;max-width:64px;">Venue to confirm</span>
          </div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="font-size:15px;font-weight:600;">Olio DOP di Biosio</div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Produced in Biosio, the hillside hamlet above town, and described as Europe's northernmost olive oil (DOP) — worth asking for by name.</div>
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Biosio%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" title="Biosio hamlet" aria-label="Get directions to the Biosio hamlet, where this oil is produced" style="flex:0 0 30px;height:30px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);display:flex;align-items:center;justify-content:center;color:#1C2620;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>
            </a>
          </div>
        </div>

      </div>
    </sc-if>

    <sc-if value="{{tabIsWhere}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;flex-direction:column;gap:10px;">

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <div style="font-size:15px;font-weight:600;">La Darsena</div>
                      </div>
          <div style="font-size:12.5px;color:rgba(28,38,32,0.6);margin-top:3px;">In a former filanda on the lakefront · Valtellina cuisine, hand-made pizzoccheri, open kitchen</div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <div style="font-size:15px;font-weight:600;">Crotto di Biosio</div>
                      </div>
          <div style="font-size:12.5px;color:rgba(28,38,32,0.6);margin-top:3px;">Traditional crotto · Lombard cuisine</div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <div style="font-size:15px;font-weight:600;">Trattoria del Ponte</div>
                      </div>
          <div style="font-size:12.5px;color:rgba(28,38,32,0.6);margin-top:3px;">Historic family-run trattoria · perch risotto</div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <div style="font-size:15px;font-weight:600;">Taverna Malanotte</div>
                      </div>
          <div style="font-size:12.5px;color:rgba(28,38,32,0.6);margin-top:3px;">Italian and European cuisine</div>
        </div>

        <div style="background:#fff;border:1px solid #C1633B;border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <div style="display:flex;align-items:baseline;gap:8px;">
              <div style="font-size:15px;font-weight:600;">Pasticceria Lorla</div>
              <span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#C1633B;">Don't skip</span>
            </div>
                      </div>
          <div style="font-size:12.5px;color:rgba(28,38,32,0.6);margin-top:3px;">One of Bellano's best-known pastry shops, noted for its panettone. Worth the trip on its own.</div>
        </div>

      </div>
    </sc-if>

    <sc-if value="{{tabIsPhotos}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div>
          <div style="height:150px;border-radius:14px;background:linear-gradient(160deg,#8A4A2E,#3A1B0F);display:flex;align-items:center;justify-content:center;color:rgba(244,239,230,0.6);font-size:11px;text-align:center;">[PHOTO<br>missoltini drying racks]</div>
          <div style="font-size:11.5px;color:rgba(28,38,32,0.55);margin-top:6px;">Agone fish salted and sun-dried the traditional way.</div>
        </div>
        <div>
          <div style="height:150px;border-radius:14px;background:linear-gradient(160deg,#2F6F6A,#1C2620);display:flex;align-items:center;justify-content:center;color:rgba(244,239,230,0.55);font-size:11px;text-align:center;">[PHOTO<br>hand-cut pizzoccheri]</div>
          <div style="font-size:11.5px;color:rgba(28,38,32,0.55);margin-top:6px;">Pizzoccheri, the buckwheat pasta of the Valtellina.</div>
        </div>
        <div>
          <div style="height:150px;border-radius:14px;background:linear-gradient(160deg,#C1633B,#5C2C18);display:flex;align-items:center;justify-content:center;color:rgba(244,239,230,0.7);font-size:11px;text-align:center;">[PHOTO<br>risotto al pesce persico]</div>
          <div style="font-size:11.5px;color:rgba(28,38,32,0.55);margin-top:6px;">Risotto al pesce persico, a classic of the lake.</div>
        </div>
      </div>
    </sc-if>

  </div>

  <div style="padding:0 20px 26px;">
    <div style="font-size:11px;color:rgba(28,38,32,0.4);border-top:1px solid rgba(28,38,32,0.10);padding-top:12px;">Compiled from public listings and food guides — venues to be verified on site before launch.</div>
  </div>

</div>
</template>
<script src="riva-runtime.js"></script>
<script src="config.js"></script>
<script>

class Component extends DCLogic {
  storeKey() { return 'riva.bellano.v1'; }
  catalog() {
    return [
      { id: 'welcome', name: 'Arrived', how: 'Open Riva in Bellano', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z M12 11.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z' },
      { id: 'see', name: 'See', how: 'Open all three See tabs', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z M12 15a3 3 0 100-6 3 3 0 000 6z' },
      { id: 'table', name: 'At the table', how: 'Open all three Eat tabs', color: '#C1633B', tint: '#FBEDE6', glyph: 'M6 3v8a2 2 0 002 2h0a2 2 0 002-2V3M8 13v8M17 3c-1.7 0-3 2-3 5s1.3 5 3 5m0-10v18' },
      { id: 'pin', name: 'Follow the pin', how: 'Tap a pin for directions', color: '#C1633B', tint: '#FBEDE6', glyph: 'M3 11l19-9-9 19-2-8-8-2z' },
      { id: 'checkin', name: 'Check-in', how: 'Say how you got here', color: '#C1633B', tint: '#FBEDE6', glyph: 'M9 12l2 2 4-4 M12 21a9 9 0 100-18 9 9 0 000 18z' },
      { id: 'slow', name: 'Slow traveller', how: 'Arrive by train or boat', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M11 20A7 7 0 019.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12' },
      { id: 'meet', name: 'Meet', how: 'Open all three Meet tabs', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75' },
      { id: 'street', name: 'Street', how: 'Open all three Street tabs', color: '#C1633B', tint: '#FBEDE6', glyph: 'M12 22a10 10 0 100-20 10 10 0 000 20z M12 6v6l4 2' }
    ];
  }
  readStore() {
    var raw = null;
    try { raw = window.localStorage.getItem(this.storeKey()); } catch (e) {}
    if (!raw) { try { raw = window.__rivaMem || null; } catch (e) {} }
    var data = null;
    try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
    if (!data || typeof data !== 'object') data = {};
    if (!Array.isArray(data.stamps)) data.stamps = [];
    if (!data.tabs || typeof data.tabs !== 'object') data.tabs = {};
    return data;
  }
  writeStore(data) {
    var raw = JSON.stringify(data);
    try { window.__rivaMem = raw; } catch (e) {}
    try { window.localStorage.setItem(this.storeKey(), raw); } catch (e) {}
  }
  award(ids) {
    var d = this.readStore();
    var added = [];
    ids.forEach(function (id) {
      if (d.stamps.indexOf(id) < 0) { d.stamps.push(id); added.push(id); }
    });
    if (added.length) this.writeStore(d);
    return added;
  }
  celebrate(ids) {
    var self = this;
    var cat = this.catalog();
    var picked = ids.map(function (id) { return cat.filter(function (s) { return s.id === id; })[0]; });
    var have = this.readStore().stamps;
    var earnable = cat.filter(function (s) { return !s.soon; });
    var n = earnable.filter(function (s) { return have.indexOf(s.id) >= 0; }).length;
    this.setState({ toast: { title: picked.map(function (s) { return s.name; }).join(' + '), glyph: picked[0].glyph, count: n + ' of ' + earnable.length } });
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(function () { self.setState({ toast: null }); }, 4200);
  }
  noteTab(name) {
    var d = this.readStore();
    var seen = d.tabs.table || [];
    if (seen.indexOf(name) < 0) { seen.push(name); d.tabs.table = seen; this.writeStore(d); }
    if (seen.length >= 3) {
      var added = this.award(['table']);
      if (added.length) this.celebrate(added);
    }
  }

  constructor(props) {
    super(props);
    this.state = { tab: 'dishes', toast: null };
  }
  componentDidMount() {
    this.noteTab('dishes');
  }
  componentWillUnmount() {
    clearTimeout(this.toastTimer);
  }
  go(name) {
    this.setState({ tab: name });
    this.noteTab(name);
  }
  pillStyle(name) {
    var active = this.state.tab === name;
    var base = 'flex:1;text-align:center;padding:9px 0;border-radius:10px;font-size:12.5px;font-weight:600;border:none;';
    return active
      ? base + 'background:#C1633B;color:#F4EFE6;'
      : base + 'background:transparent;color:rgba(28,38,32,0.55);';
  }
  renderVals() {
    var self = this;
    var t = this.state.toast || { title: '', glyph: '', count: '' };
    return {
      tabIsDishes: this.state.tab === 'dishes',
      tabIsWhere: this.state.tab === 'where',
      tabIsPhotos: this.state.tab === 'photos',
      pillDishesStyle: this.pillStyle('dishes'),
      pillWhereStyle: this.pillStyle('where'),
      pillPhotosStyle: this.pillStyle('photos'),
      goDishes: function () { self.go('dishes'); },
      goWhere: function () { self.go('where'); },
      goPhotos: function () { self.go('photos'); },
      onPin: function () {
        var added = self.award(['pin']);
        if (added.length) self.celebrate(added);
      },
      hasToast: !!this.state.toast,
      toastTitle: t.title,
      toastGlyph: t.glyph,
      toastCount: t.count
    };
  }
}

rivaMount({Component: Component});
(function(){var u=(window.RIVA_CONFIG||{}).feedbackUrl;if(u){var s=document.getElementById('fb');var a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.textContent='Give feedback';s.textContent=' · ';s.appendChild(a);}})();
</script>
</body>
</html>
