<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riva — Bellano</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;background:#F4EFE6;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
</style>

<style>#demo-note{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#1C2620;color:#F4EFE6;font:500 11.5px/1.35 'Space Grotesk',Helvetica,Arial,sans-serif;text-align:center;padding:7px 12px}#demo-note a{text-decoration:underline}body{padding-bottom:34px}</style>
</head>
<body>
<div id="riva-root"></div>
<div id="demo-note">Prototype for feedback · demo content: texts to be verified, photos are placeholders<span id="fb"></span></div>
<template id="riva-template">


<div style="width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:#F4EFE6;font-family:'Space Grotesk',Helvetica,Arial,sans-serif;color:#1C2620;display:flex;flex-direction:column;">

  <div role="status" aria-live="polite">
    <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
      <a href="passport.html" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:440px;z-index:50;display:flex;align-items:center;gap:12px;background:#1C2620;color:#F4EFE6;border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(28,38,32,0.28);">
        <div style="flex:0 0 38px;height:38px;border-radius:999px;border:2px solid #F4EFE6;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4EFE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{toastGlyph}}"/></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(244,239,230,0.6);">New stamp</div>
          <div style="font-size:14px;font-weight:600;margin-top:1px;">{{toastTitle}}</div>
        </div>
        <div style="flex:0 0 auto;font-size:12px;color:rgba(244,239,230,0.7);">{{toastCount}}</div>
      </a>
    </sc-if>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;">
    <div style="font-family:'Instrument Serif',Georgia,serif;font-size:22px;letter-spacing:0.02em;">Riva</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button type="button" aria-label="Change town" style="display:flex;align-items:center;gap:6px;background:#fff;border:1px solid rgba(28,38,32,0.14);border-radius:999px;padding:7px 12px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:#1C2620;">
        Bellano
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button type="button" aria-label="Search" style="display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;background:#fff;border:1px solid rgba(28,38,32,0.14);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
    </div>
  </div>

  <div style="margin:8px 20px 0;border-radius:20px;overflow:hidden;position:relative;height:300px;background:linear-gradient(155deg,#3B564E 0%,#20302A 60%,#16211C 100%);display:flex;flex-direction:column;justify-content:flex-end;">
    <div style="position:absolute;top:14px;left:14px;background:rgba(244,239,230,0.92);border-radius:999px;padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#2F6F6A;">60-second brief</div>
    <div style="position:absolute;top:14px;right:14px;color:rgba(244,239,230,0.6);font-size:10.5px;font-family:'Space Grotesk',sans-serif;text-align:right;line-height:1.4;">[PHOTO<br>Orrido walkway]</div>
    <div style="padding:22px 22px 24px;position:relative;">
      <div style="font-family:'Instrument Serif',Georgia,serif;font-size:44px;line-height:0.95;color:#F4EFE6;">Bellano</div>
      <div style="margin-top:8px;font-size:14.5px;line-height:1.45;color:rgba(244,239,230,0.82);max-width:280px;">A ravine runs straight through this lake town.</div>
    </div>
  </div>

  <div style="display:flex;gap:8px;overflow-x:auto;padding:16px 20px 4px;">
    <div style="flex:0 0 auto;background:#fff;border:1px solid rgba(28,38,32,0.12);border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:500;white-space:nowrap;">A canyon in the town centre</div>
    <div style="flex:0 0 auto;background:#fff;border:1px solid rgba(28,38,32,0.12);border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:500;white-space:nowrap;">70 min from Milan by train</div>
    <div style="flex:0 0 auto;background:#fff;border:1px solid rgba(28,38,32,0.12);border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:500;white-space:nowrap;">Quieter than Bellagio</div>
    <div style="flex:0 0 auto;background:#fff;border:1px solid rgba(28,38,32,0.12);border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:500;white-space:nowrap;">Home town of novelist Andrea Vitali</div>
  </div>

  <div style="padding:26px 20px 10px;display:flex;align-items:baseline;justify-content:space-between;">
    <div style="font-family:'Instrument Serif',Georgia,serif;font-size:20px;">Get to know it</div>
    <div style="font-size:11.5px;color:rgba(28,38,32,0.5);">4 threads, one glance each</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;padding:0 20px 14px;">

    <a href="see.html" style="display:flex;align-items:center;gap:14px;background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:16px;padding:14px 16px;">
      <div style="flex:0 0 44px;height:44px;border-radius:12px;background:#EAF2F1;display:flex;align-items:center;justify-content:center;color:#2F6F6A;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:15px;font-weight:600;">See</div>
        <div style="font-size:12.5px;color:rgba(28,38,32,0.6);margin-top:2px;">The Orrido, the old town, the lakefront, the churches</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="color:rgba(28,38,32,0.35);flex:0 0 16px;"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <a href="eat.html" style="display:flex;align-items:center;gap:14px;background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:16px;padding:14px 16px;">
      <div style="flex:0 0 44px;height:44px;border-radius:12px;background:#FBEDE6;display:flex;align-items:center;justify-content:center;color:#C1633B;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v8a2 2 0 002 2h0a2 2 0 002-2V3M8 13v8M17 3c-1.7 0-3 2-3 5s1.3 5 3 5m0-10v18"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:15px;font-weight:600;">Eat</div>
        <div style="font-size:12.5px;color:rgba(28,38,32,0.6);margin-top:2px;">Missoltini, pizzoccheri, miascia — and where</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="color:rgba(28,38,32,0.35);flex:0 0 16px;"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <a href="meet.html" style="display:flex;align-items:center;gap:14px;background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:16px;padding:14px 16px;">
      <div style="flex:0 0 44px;height:44px;border-radius:12px;background:#EAF2F1;display:flex;align-items:center;justify-content:center;color:#2F6F6A;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:15px;font-weight:600;">Meet</div>
        <div style="font-size:12.5px;color:rgba(28,38,32,0.6);margin-top:2px;">The novelist, the painters, the legends</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="color:rgba(28,38,32,0.35);flex:0 0 16px;"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <a href="street.html" style="display:flex;align-items:center;gap:14px;background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:16px;padding:14px 16px;">
      <div style="flex:0 0 44px;height:44px;border-radius:12px;background:#FBEDE6;display:flex;align-items:center;justify-content:center;color:#C1633B;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:15px;font-weight:600;">Street</div>
        <div style="font-size:12.5px;color:rgba(28,38,32,0.6);margin-top:2px;">Trains, boats, parking, pairing with Varenna</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="color:rgba(28,38,32,0.35);flex:0 0 16px;"><path d="M9 6l6 6-6 6"/></svg>
    </a>

  </div>

  <a href="passport.html" style="margin:0 20px 14px;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:16px;padding:14px 16px;">
    <div style="flex:0 0 44px;height:44px;border-radius:999px;border:2px solid #1C2620;display:flex;align-items:center;justify-content:center;color:#1C2620;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a6 6 0 100-12 6 6 0 000 12z M8.2 13.9L7 23l5-3 5 3-1.2-9.1"/></svg>
    </div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:15px;font-weight:600;">Your passport</div>
      <div style="font-size:12.5px;color:rgba(28,38,32,0.6);margin-top:2px;">{{passportSub}}</div>
      <div style="display:flex;gap:6px;margin-top:9px;">
        <sc-for list="{{dots}}" as="dot" hint-placeholder-count="6">
          <div style="{{dot.style}}"></div>
        </sc-for>
      </div>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="color:rgba(28,38,32,0.35);flex:0 0 16px;"><path d="M9 6l6 6-6 6"/></svg>
  </a>

  <div style="margin:8px 20px 20px;background:#1C2620;border-radius:16px;padding:16px 18px;color:#F4EFE6;display:flex;align-items:center;gap:12px;">
    <div style="flex:0 0 auto;width:34px;height:34px;border-radius:999px;background:rgba(244,239,230,0.12);display:flex;align-items:center;justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F4EFE6" stroke-width="2"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>
    </div>
    <div style="flex:1;">
      <div style="font-size:12px;color:rgba(244,239,230,0.6);">Right now in Bellano</div>
      <div style="font-size:13.5px;font-weight:600;margin-top:1px;">Jan 5 — Pesa Vegia, 400 years of torchlit tradition</div>
    </div>
  </div>

  <div style="padding:0 20px 28px;text-align:center;">
    <div style="font-size:11px;color:rgba(28,38,32,0.45);">Also on Riva</div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap;">
      <span style="font-size:12px;padding:6px 12px;border:1px solid rgba(28,38,32,0.14);border-radius:999px;color:rgba(28,38,32,0.55);">Bellagio</span>
      <span style="font-size:12px;padding:6px 12px;border:1px solid rgba(28,38,32,0.14);border-radius:999px;color:rgba(28,38,32,0.55);">Varenna</span>
      <span style="font-size:12px;padding:6px 12px;border:1px solid rgba(28,38,32,0.14);border-radius:999px;color:rgba(28,38,32,0.55);">Menaggio</span>
    </div>
  </div>

</div>
</template>
<script src="riva-runtime.js"></script>
<script src="config.js"></script>
<script>

class Component extends DCLogic {
  storeKey() { return 'riva.bellano.v1'; }
  catalog() {
    return [
      { id: 'welcome', name: 'Arrived', how: 'Open Riva in Bellano', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z M12 11.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z' },
      { id: 'see', name: 'See', how: 'Open all three See tabs', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z M12 15a3 3 0 100-6 3 3 0 000 6z' },
      { id: 'table', name: 'At the table', how: 'Open all three Eat tabs', color: '#C1633B', tint: '#FBEDE6', glyph: 'M6 3v8a2 2 0 002 2h0a2 2 0 002-2V3M8 13v8M17 3c-1.7 0-3 2-3 5s1.3 5 3 5m0-10v18' },
      { id: 'pin', name: 'Follow the pin', how: 'Tap a pin for directions', color: '#C1633B', tint: '#FBEDE6', glyph: 'M3 11l19-9-9 19-2-8-8-2z' },
      { id: 'checkin', name: 'Check-in', how: 'Say how you got here', color: '#C1633B', tint: '#FBEDE6', glyph: 'M9 12l2 2 4-4 M12 21a9 9 0 100-18 9 9 0 000 18z' },
      { id: 'slow', name: 'Slow traveller', how: 'Arrive by train or boat', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M11 20A7 7 0 019.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12' },
      { id: 'meet', name: 'Meet', how: 'Open all three Meet tabs', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75' },
      { id: 'street', name: 'Street', how: 'Open all three Street tabs', color: '#C1633B', tint: '#FBEDE6', glyph: 'M12 22a10 10 0 100-20 10 10 0 000 20z M12 6v6l4 2' }
    ];
  }
  readStore() {
    var raw = null;
    try { raw = window.localStorage.getItem(this.storeKey()); } catch (e) {}
    if (!raw) { try { raw = window.__rivaMem || null; } catch (e) {} }
    var data = null;
    try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
    if (!data || typeof data !== 'object') data = {};
    if (!Array.isArray(data.stamps)) data.stamps = [];
    if (!data.tabs || typeof data.tabs !== 'object') data.tabs = {};
    return data;
  }
  writeStore(data) {
    var raw = JSON.stringify(data);
    try { window.__rivaMem = raw; } catch (e) {}
    try { window.localStorage.setItem(this.storeKey(), raw); } catch (e) {}
  }
  award(ids) {
    var d = this.readStore();
    var added = [];
    ids.forEach(function (id) {
      if (d.stamps.indexOf(id) < 0) { d.stamps.push(id); added.push(id); }
    });
    if (added.length) this.writeStore(d);
    return added;
  }
  celebrate(ids) {
    var self = this;
    var cat = this.catalog();
    var picked = ids.map(function (id) { return cat.filter(function (s) { return s.id === id; })[0]; });
    var have = this.readStore().stamps;
    var earnable = cat.filter(function (s) { return !s.soon; });
    var n = earnable.filter(function (s) { return have.indexOf(s.id) >= 0; }).length;
    this.setState({ toast: { title: picked.map(function (s) { return s.name; }).join(' + '), glyph: picked[0].glyph, count: n + ' of ' + earnable.length } });
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(function () { self.setState({ toast: null }); }, 4200);
  }

  constructor(props) {
    super(props);
    this.state = { stamps: this.readStore().stamps, toast: null };
  }
  componentDidMount() {
    var self = this;
    var added = this.award(['welcome']);
    this.setState({ stamps: this.readStore().stamps });
    if (added.length) this.celebrate(added);
    this.poll = setInterval(function () {
      var s = self.readStore().stamps;
      if (s.join(',') !== self.state.stamps.join(',')) self.setState({ stamps: s });
    }, 1500);
  }
  componentWillUnmount() {
    clearInterval(this.poll);
    clearTimeout(this.toastTimer);
  }
  renderVals() {
    var have = this.state.stamps;
    var earnable = this.catalog().filter(function (s) { return !s.soon; });
    var n = earnable.filter(function (s) { return have.indexOf(s.id) >= 0; }).length;
    var t = this.state.toast || { title: '', glyph: '', count: '' };
    return {
      passportSub: n >= earnable.length
        ? 'All ' + earnable.length + ' stamps collected'
        : n + ' of ' + earnable.length + ' stamps · open a section to earn more',
      dots: earnable.map(function (s) {
        var on = have.indexOf(s.id) >= 0;
        return { style: 'width:10px;height:10px;border-radius:999px;' + (on ? 'background:' + s.color + ';' : 'border:1.5px solid rgba(28,38,32,0.25);') };
      }),
      hasToast: !!this.state.toast,
      toastTitle: t.title,
      toastGlyph: t.glyph,
      toastCount: t.count
    };
  }
}

rivaMount({Component: Component});
(function(){var u=(window.RIVA_CONFIG||{}).feedbackUrl;if(u){var s=document.getElementById('fb');var a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.textContent='Give feedback';s.textContent=' · ';s.appendChild(a);}})();
</script>
</body>
</html>
