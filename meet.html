<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bellano — Meet</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;background:#F4EFE6;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
</style>

<style>#demo-note{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#1C2620;color:#F4EFE6;font:500 11.5px/1.35 'Space Grotesk',Helvetica,Arial,sans-serif;text-align:center;padding:7px 12px}#demo-note a{text-decoration:underline}body{padding-bottom:34px}</style>
</head>
<body>
<div id="riva-root"></div>
<div id="demo-note">Prototype for feedback · demo content: texts to be verified, photos are placeholders<span id="fb"></span></div>
<template id="riva-template">


<div style="width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:#F4EFE6;font-family:'Space Grotesk',Helvetica,Arial,sans-serif;color:#1C2620;display:flex;flex-direction:column;">

  <div role="status" aria-live="polite">
    <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
      <a href="passport.html" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:440px;z-index:50;display:flex;align-items:center;gap:12px;background:#1C2620;color:#F4EFE6;border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(28,38,32,0.28);">
        <div style="flex:0 0 38px;height:38px;border-radius:999px;border:2px solid #F4EFE6;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4EFE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{toastGlyph}}"/></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(244,239,230,0.6);">New stamp</div>
          <div style="font-size:14px;font-weight:600;margin-top:1px;">{{toastTitle}}</div>
        </div>
        <div style="flex:0 0 auto;font-size:12px;color:rgba(244,239,230,0.7);">{{toastCount}}</div>
      </a>
    </sc-if>
  </div>

  <div style="position:relative;height:220px;border-radius:0 0 20px 20px;overflow:hidden;background:linear-gradient(155deg,#47615A 0%,#2B3D36 60%,#1A2420 100%);display:flex;flex-direction:column;justify-content:space-between;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0;">
      <a href="index.html" aria-label="Back to Bellano overview" style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;background:rgba(244,239,230,0.16);color:#F4EFE6;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div style="color:rgba(244,239,230,0.6);font-size:10.5px;text-align:right;line-height:1.4;">[PHOTO<br>Bellano old town]</div>
    </div>
    <div style="padding:0 20px 20px;">
      <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(244,239,230,0.6);">Meet · Bellano</div>
      <div style="font-family:'Instrument Serif',Georgia,serif;font-size:34px;line-height:1;color:#F4EFE6;margin-top:4px;">Who made Bellano</div>
    </div>
  </div>

  <div style="display:flex;gap:4px;background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:4px;margin:16px 20px 4px;">
    <button type="button" style="{{pillPeopleStyle}}" onClick="{{goPeople}}">People</button>
    <button type="button" style="{{pillStoriesStyle}}" onClick="{{goStories}}">Stories</button>
    <button type="button" style="{{pillWalkStyle}}" onClick="{{goWalk}}">Trail</button>
  </div>

  <div style="padding:14px 20px 32px;flex:1;">

    <sc-if value="{{tabIsPeople}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;flex-direction:column;gap:12px;">

        <p style="font-size:13.5px;line-height:1.55;margin:0 0 2px;color:rgba(28,38,32,0.7);">A town of about 3,000 people, often called the town of artists.</p>

        <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(28,38,32,0.45);">Then</div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">
            <div style="font-size:15px;font-weight:600;">Tommaso Grossi</div>
            <div style="font-size:12px;color:rgba(28,38,32,0.5);flex:0 0 auto;">1790–1853</div>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Poet and novelist born in Bellano, part of Alessandro Manzoni's circle in Milan.</div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">
            <div style="font-size:15px;font-weight:600;">Sigismondo Boldoni</div>
            <div style="font-size:12px;color:rgba(28,38,32,0.5);flex:0 0 auto;">17th century</div>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Physician, philosopher and poet. His line about the Orrido is still the best-known description of it.</div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="font-size:15px;font-weight:600;">Also from Bellano</div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">The writers Antonio Balbiani and Luciano Lombardi.</div>
        </div>

        <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(28,38,32,0.45);margin-top:6px;">Now</div>

        <div style="background:#fff;border:1px solid #2F6F6A;border-radius:14px;padding:14px 16px;">
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
            <div style="font-size:15px;font-weight:600;">Andrea Vitali</div>
            <span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Start here</span>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Novelist who sets his books in Bellano, with its people and traditions. His voice narrates the town's visitor app.</div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">
            <div style="font-size:15px;font-weight:600;">Giancarlo Vitali</div>
            <div style="font-size:12px;color:rgba(28,38,32,0.5);flex:0 0 auto;">1929–2018</div>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Painter born in Bellano. Over 100 of his paintings, made across about seventy years, hang in the town's museum.</div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="font-size:15px;font-weight:600;">Velasco Vitali</div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Painter, and Giancarlo's son.</div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">
            <div style="font-size:15px;font-weight:600;">Danilo Vitali</div>
            <div style="font-size:12px;color:rgba(28,38,32,0.5);flex:0 0 auto;">born 1935</div>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Sculptor born in Bellano. His copper fish hang from the ceiling at San Nicolao Arte Contemporanea.</div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="font-size:15px;font-weight:600;">Carlo Borlenghi</div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Photographer whose images illustrate the town's visitor app.</div>
        </div>

      </div>
    </sc-if>

    <sc-if value="{{tabIsStories}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;flex-direction:column;gap:12px;">

        <div style="background:#fff;border:1px solid #C1633B;border-radius:14px;padding:14px 16px;">
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
            <div style="font-size:15px;font-weight:600;">Pesa Vegia</div>
            <span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#C1633B;">Every Jan 5</span>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">A re-enactment of a dispute over weights and measures under Spanish rule: a delegation from Bellano went to Como to ask that the old standards be kept, and won.</div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:8px;">Today it brings a procession of the Magi, a race of the "pese" through the streets, the governor arriving by boat, the edict read from the Town Hall balcony and a bonfire on the pier. It has been held for more than four centuries.</div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="font-size:15px;font-weight:600;">The Devil's House</div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">The Ca' del Diavol is a three-storey pentagonal tower at the gorge entrance, known since the early 1600s. Its origins are uncertain. The name comes from frescoes of mythological figures and a satyr, which local lore tied to the devil.</div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="font-size:15px;font-weight:600;">A treasure in the gorge</div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">A local tale says a Taino warrior lies buried with an enormous treasure deep in the Orrido.</div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="font-size:15px;font-weight:600;">A gorge that worked</div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">From the 16th century the stream's force drove forges that worked iron from the Valsassina mines. Later it powered silk mills and a cotton mill.</div>
        </div>

        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="font-size:15px;font-weight:600;">Writers on the Orrido</div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Stendhal mentions it in his <em>Viaggio in Italia</em>. Johann Jakob Wetzel and Boldoni also wrote about it.</div>
        </div>

      </div>
    </sc-if>

    <sc-if value="{{tabIsWalk}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <p style="font-size:13.5px;line-height:1.55;margin:0 0 2px;color:rgba(28,38,32,0.7);">Places tied to the people in this section. Tap a pin for directions.</p>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(28,38,32,0.45);margin-bottom:4px;">Tommaso Grossi</div><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;"><div style="font-size:15px;font-weight:600;">Monumento a Tommaso Grossi</div></div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">On the lakefront. White marble, inaugurated in 1876, made by Antonio Tantardini. The inscription is signed by Alessandro Manzoni.</div>
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Monumento%20a%20Tommaso%20Grossi%2C%20Viale%20Tommaso%20Grossi%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" title="Monumento a Tommaso Grossi" aria-label="Get directions to Monumento a Tommaso Grossi" style="flex:0 0 30px;height:30px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);display:flex;align-items:center;justify-content:center;color:#1C2620;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg></a>
          </div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(28,38,32,0.45);margin-bottom:4px;">Sigismondo Boldoni and other writers</div><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;"><div style="font-size:15px;font-weight:600;">Orrido di Bellano</div></div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Boldoni, Stendhal and Wetzel all wrote about the gorge.</div>
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Orrido%20di%20Bellano%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" title="Orrido di Bellano" aria-label="Get directions to Orrido di Bellano" style="flex:0 0 30px;height:30px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);display:flex;align-items:center;justify-content:center;color:#1C2620;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg></a>
          </div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(28,38,32,0.45);margin-bottom:4px;">Giancarlo Vitali</div><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;"><div style="font-size:15px;font-weight:600;">Museo Giancarlo Vitali</div></div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Via Manzoni 50, in Palazzo Lorla. Over 100 of his paintings.</div>
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Museo%20Giancarlo%20Vitali%2C%20Via%20Manzoni%2050%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" title="Museo Giancarlo Vitali" aria-label="Get directions to Museo Giancarlo Vitali" style="flex:0 0 30px;height:30px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);display:flex;align-items:center;justify-content:center;color:#1C2620;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg></a>
          </div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(28,38,32,0.45);margin-bottom:4px;">Danilo Vitali</div><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;"><div style="font-size:15px;font-weight:600;">San Nicolao Arte Contemporanea</div></div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Via San Nicolao 9. His copper fish hang from the ceiling.</div>
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=San%20Nicolao%20Arte%20Contemporanea%2C%20Via%20San%20Nicolao%209%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" title="San Nicolao Arte Contemporanea" aria-label="Get directions to San Nicolao Arte Contemporanea" style="flex:0 0 30px;height:30px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);display:flex;align-items:center;justify-content:center;color:#1C2620;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg></a>
          </div>
        </div>
        <div style="margin-top:4px;background:#fff;border:1px solid #2F6F6A;border-radius:14px;padding:14px 16px;">
          <div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#2F6F6A;">The town's own app</div>
          <div style="font-size:13.5px;line-height:1.5;margin-top:6px;">Discovering Bellano, made for the Comune, has two itineraries. "I luoghi sono reali" walks through excerpts of Andrea Vitali's novels, read aloud by him. "Saperi e Sapori" covers the villages around Bellano. In Italian and English, on iOS and Android.</div>
        </div>
      </div>
    </sc-if>

  </div>

  <div style="padding:0 20px 26px;">
    <div style="font-size:11px;color:rgba(28,38,32,0.4);border-top:1px solid rgba(28,38,32,0.10);padding-top:12px;">Compiled from public tourism sources — to be verified on site before launch.</div>
  </div>

</div>
</template>
<script src="riva-runtime.js"></script>
<script src="config.js"></script>
<script>

class Component extends DCLogic {
  storeKey() { return 'riva.bellano.v1'; }
  catalog() {
    return [
      { id: 'welcome', name: 'Arrived', how: 'Open Riva in Bellano', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z M12 11.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z' },
      { id: 'see', name: 'See', how: 'Open all three See tabs', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z M12 15a3 3 0 100-6 3 3 0 000 6z' },
      { id: 'table', name: 'At the table', how: 'Open all three Eat tabs', color: '#C1633B', tint: '#FBEDE6', glyph: 'M6 3v8a2 2 0 002 2h0a2 2 0 002-2V3M8 13v8M17 3c-1.7 0-3 2-3 5s1.3 5 3 5m0-10v18' },
      { id: 'pin', name: 'Follow the pin', how: 'Tap a pin for directions', color: '#C1633B', tint: '#FBEDE6', glyph: 'M3 11l19-9-9 19-2-8-8-2z' },
      { id: 'checkin', name: 'Check-in', how: 'Say how you got here', color: '#C1633B', tint: '#FBEDE6', glyph: 'M9 12l2 2 4-4 M12 21a9 9 0 100-18 9 9 0 000 18z' },
      { id: 'slow', name: 'Slow traveller', how: 'Arrive by train or boat', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M11 20A7 7 0 019.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12' },
      { id: 'meet', name: 'Meet', how: 'Open all three Meet tabs', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75' },
      { id: 'street', name: 'Street', how: 'Open all three Street tabs', color: '#C1633B', tint: '#FBEDE6', glyph: 'M12 22a10 10 0 100-20 10 10 0 000 20z M12 6v6l4 2' }
    ];
  }
  readStore() {
    var raw = null;
    try { raw = window.localStorage.getItem(this.storeKey()); } catch (e) {}
    if (!raw) { try { raw = window.__rivaMem || null; } catch (e) {} }
    var data = null;
    try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
    if (!data || typeof data !== 'object') data = {};
    if (!Array.isArray(data.stamps)) data.stamps = [];
    if (!data.tabs || typeof data.tabs !== 'object') data.tabs = {};
    return data;
  }
  writeStore(data) {
    var raw = JSON.stringify(data);
    try { window.__rivaMem = raw; } catch (e) {}
    try { window.localStorage.setItem(this.storeKey(), raw); } catch (e) {}
  }
  award(ids) {
    var d = this.readStore();
    var added = [];
    ids.forEach(function (id) {
      if (d.stamps.indexOf(id) < 0) { d.stamps.push(id); added.push(id); }
    });
    if (added.length) this.writeStore(d);
    return added;
  }
  celebrate(ids) {
    var self = this;
    var cat = this.catalog();
    var picked = ids.map(function (id) { return cat.filter(function (s) { return s.id === id; })[0]; });
    var have = this.readStore().stamps;
    var earnable = cat.filter(function (s) { return !s.soon; });
    var n = earnable.filter(function (s) { return have.indexOf(s.id) >= 0; }).length;
    this.setState({ toast: { title: picked.map(function (s) { return s.name; }).join(' + '), glyph: picked[0].glyph, count: n + ' of ' + earnable.length } });
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(function () { self.setState({ toast: null }); }, 4200);
  }
  noteTab(name) {
    var d = this.readStore();
    var seen = d.tabs.meet || [];
    if (seen.indexOf(name) < 0) { seen.push(name); d.tabs.meet = seen; this.writeStore(d); }
    if (seen.length >= 3) {
      var added = this.award(['meet']);
      if (added.length) this.celebrate(added);
    }
  }

  constructor(props) {
    super(props);
    this.state = { tab: 'people', toast: null };
  }
  componentDidMount() {
    this.noteTab('people');
  }
  componentWillUnmount() {
    clearTimeout(this.toastTimer);
  }
  go(name) {
    this.setState({ tab: name });
    this.noteTab(name);
  }
  pillStyle(name) {
    var active = this.state.tab === name;
    var base = 'flex:1;text-align:center;padding:9px 0;border-radius:10px;font-size:12.5px;font-weight:600;border:none;';
    return active
      ? base + 'background:#2F6F6A;color:#F4EFE6;'
      : base + 'background:transparent;color:rgba(28,38,32,0.55);';
  }
  renderVals() {
    var self = this;
    var t = this.state.toast || { title: '', glyph: '', count: '' };
    return {
      tabIsPeople: this.state.tab === 'people',
      tabIsStories: this.state.tab === 'stories',
      tabIsWalk: this.state.tab === 'walk',
      pillPeopleStyle: this.pillStyle('people'),
      pillStoriesStyle: this.pillStyle('stories'),
      pillWalkStyle: this.pillStyle('walk'),
      goPeople: function () { self.go('people'); },
      goStories: function () { self.go('stories'); },
      goWalk: function () { self.go('walk'); },
      onPin: function () {
        var added = self.award(['pin']);
        if (added.length) self.celebrate(added);
      },
      hasToast: !!this.state.toast,
      toastTitle: t.title,
      toastGlyph: t.glyph,
      toastCount: t.count
    };
  }
}
