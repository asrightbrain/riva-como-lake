<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bellano — Orrido</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;background:#F4EFE6;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
  dl{margin:0;}
</style>

<style>#demo-note{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#1C2620;color:#F4EFE6;font:500 11.5px/1.35 'Space Grotesk',Helvetica,Arial,sans-serif;text-align:center;padding:7px 12px}#demo-note a{text-decoration:underline}body{padding-bottom:34px}</style>
</head>
<body>
<div id="riva-root"></div>
<div id="demo-note">Prototype for feedback · demo content: texts to be verified, photos are placeholders<span id="fb"></span></div>
<template id="riva-template">


<div style="width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:#F4EFE6;font-family:'Space Grotesk',Helvetica,Arial,sans-serif;color:#1C2620;display:flex;flex-direction:column;">

  <div role="status" aria-live="polite">
    <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
      <a href="passport.html" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:440px;z-index:50;display:flex;align-items:center;gap:12px;background:#1C2620;color:#F4EFE6;border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(28,38,32,0.28);">
        <div style="flex:0 0 38px;height:38px;border-radius:999px;border:2px solid #F4EFE6;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4EFE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{toastGlyph}}"/></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(244,239,230,0.6);">New stamp</div>
          <div style="font-size:14px;font-weight:600;margin-top:1px;">{{toastTitle}}</div>
        </div>
        <div style="flex:0 0 auto;font-size:12px;color:rgba(244,239,230,0.7);">{{toastCount}}</div>
      </a>
    </sc-if>
  </div>

  <div style="position:relative;height:220px;border-radius:0 0 20px 20px;overflow:hidden;background:linear-gradient(155deg,#3B564E 0%,#20302A 60%,#16211C 100%);display:flex;flex-direction:column;justify-content:space-between;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0;">
      <a href="index.html" aria-label="Back to Bellano overview" style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;background:rgba(244,239,230,0.16);color:#F4EFE6;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div style="color:rgba(244,239,230,0.6);font-size:10.5px;text-align:right;line-height:1.4;">[PHOTO<br>suspended walkway]</div>
    </div>
    <div style="padding:0 20px 20px;">
      <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(244,239,230,0.6);">See · Bellano</div>
      <div style="font-family:'Instrument Serif',Georgia,serif;font-size:34px;line-height:1;color:#F4EFE6;margin-top:4px;">Orrido di Bellano</div>
    </div>
  </div>

  <div style="display:flex;gap:4px;background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:4px;margin:16px 20px 4px;">
    <button type="button" style="{{pillOverviewStyle}}" onClick="{{goOverview}}">Overview</button>
    <button type="button" style="{{pillPhotosStyle}}" onClick="{{goPhotos}}">Photos</button>
    <button type="button" style="{{pillPracticalStyle}}" onClick="{{goPractical}}">Practical</button>
  </div>

  <div style="padding:14px 20px 32px;flex:1;">

    <sc-if value="{{tabIsOverview}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;flex-direction:column;gap:16px;">
        <p style="font-size:14.5px;line-height:1.6;margin:0;color:#1C2620;">
          The Pioverna stream carved this narrow gorge over roughly 15 million years, and it sits right in Bellano — suspended walkways let you walk the ravine itself, past rock walls, plunge pools and waterfalls, in about 30 minutes.
        </p>
        <p style="font-size:14.5px;line-height:1.6;margin:0;color:#1C2620;">
          At the entrance stands the Ca' del Diavol ("Devil's House"), now a multimedia centre with VR installations on the story of the stream.
        </p>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-left:3px solid #C1633B;border-radius:12px;padding:14px 16px;">
          <div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#C1633B;">17th-century local colour</div>
          <div style="font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:17px;line-height:1.4;margin-top:6px;">"Orrore di un'orrenda orrendezza"</div>
          <div style="font-size:12px;color:rgba(28,38,32,0.6);margin-top:6px;">— Sigismondo Boldoni, 17th-century physician, philosopher and poet from Bellano, on the gorge.</div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{tabIsPhotos}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div>
          <div style="height:150px;border-radius:14px;background:linear-gradient(160deg,#2F6F6A,#1C2620);display:flex;align-items:center;justify-content:center;color:rgba(244,239,230,0.55);font-size:11px;text-align:center;">[PHOTO<br>walkway over the gorge]</div>
          <div style="font-size:11.5px;color:rgba(28,38,32,0.55);margin-top:6px;">The suspended walkways inside the gorge.</div>
        </div>
        <div>
          <div style="height:150px;border-radius:14px;background:linear-gradient(160deg,#3B564E,#16211C);display:flex;align-items:center;justify-content:center;color:rgba(244,239,230,0.55);font-size:11px;text-align:center;">[PHOTO<br>Ca' del Diavol]</div>
          <div style="font-size:11.5px;color:rgba(28,38,32,0.55);margin-top:6px;">The Ca' del Diavol at the gorge entrance.</div>
        </div>
        <div>
          <div style="height:150px;border-radius:14px;background:linear-gradient(160deg,#C1633B,#5C2C18);display:flex;align-items:center;justify-content:center;color:rgba(244,239,230,0.7);font-size:11px;text-align:center;">[PHOTO<br>waterfall &amp; plunge pool]</div>
          <div style="font-size:11.5px;color:rgba(28,38,32,0.55);margin-top:6px;">Plunge pools and waterfalls carved by the Pioverna.</div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{tabIsPractical}}" hint-placeholder-val="{{false}}">
      <dl style="display:flex;flex-direction:column;">
        <div style="display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(28,38,32,0.10);">
          <dt style="font-size:13px;color:rgba(28,38,32,0.6);">Entry</dt>
          <dd style="margin:0;font-size:13.5px;font-weight:600;text-align:right;">[price to confirm]</dd>
        </div>
        <div style="display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(28,38,32,0.10);">
          <dt style="font-size:13px;color:rgba(28,38,32,0.6);">Visit length</dt>
          <dd style="margin:0;font-size:13.5px;font-weight:600;text-align:right;">About 30 minutes</dd>
        </div>
        <div style="display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(28,38,32,0.10);">
          <dt style="font-size:13px;color:rgba(28,38,32,0.6);">Season</dt>
          <dd style="margin:0;font-size:13.5px;font-weight:600;text-align:right;">Year-round, limited hours in winter</dd>
        </div>
        <div style="display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(28,38,32,0.10);">
          <dt style="font-size:13px;color:rgba(28,38,32,0.6);">Suitable for</dt>
          <dd style="margin:0;font-size:13.5px;font-weight:600;text-align:right;">Families with children</dd>
        </div>
        <div style="display:flex;justify-content:space-between;gap:12px;padding:12px 0;">
          <dt style="font-size:13px;color:rgba(28,38,32,0.6);">From the station</dt>
          <dd style="margin:0;font-size:13.5px;font-weight:600;text-align:right;">[distance to confirm]</dd>
        </div>
      </dl>
      <div style="margin-top:16px;background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:12px;padding:14px 16px;">
        <div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#2F6F6A;">Pair it with</div>
        <div style="font-size:13.5px;line-height:1.5;margin-top:6px;">Varenna is 4 minutes further down the line — Villa Monastero and the Castello di Vezio fit in the same half-day.</div>
      </div>

      <div style="margin-top:12px;background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:12px;padding:14px 16px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#2F6F6A;">One tap</div>
          <div style="font-size:11px;color:rgba(28,38,32,0.45);">Earns a stamp</div>
        </div>
        <div style="font-size:14.5px;font-weight:600;margin-top:6px;">How did you get to Bellano?</div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button type="button" style="{{trainStyle}}" onClick="{{pickTrain}}">Train</button>
          <button type="button" style="{{boatStyle}}" onClick="{{pickBoat}}">Boat</button>
          <button type="button" style="{{carStyle}}" onClick="{{pickCar}}">Car or bus</button>
        </div>
        <sc-if value="{{noTransport}}" hint-placeholder-val="{{true}}">
          <div style="font-size:11.5px;line-height:1.5;color:rgba(28,38,32,0.5);margin-top:10px;">Why we ask: pooled with other visitors, it helps the Comune plan transport.</div>
        </sc-if>
        <sc-if value="{{hasTransport}}" hint-placeholder-val="{{false}}">
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(28,38,32,0.10);">
            <div style="font-size:14px;font-weight:600;line-height:1.4;">{{transportLine}}</div>
            <div style="font-size:12.5px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:4px;">{{transportWhy}}</div>
            <div style="font-size:12.5px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:8px;">{{contextLine}}</div>
            <div style="font-size:10.5px;color:rgba(28,38,32,0.4);margin-top:8px;">Demo figures — placeholders until real visit counts exist.</div>
          </div>
        </sc-if>
      </div>
    </sc-if>

  </div>

  <div style="padding:0 20px 26px;">
    <div style="font-size:11px;color:rgba(28,38,32,0.4);border-top:1px solid rgba(28,38,32,0.10);padding-top:12px;">Compiled from public tourism sources — to be verified on site before launch.</div>
  </div>

</div>
</template>
<script src="riva-runtime.js"></script>
<script src="config.js"></script>
<script>

class Component extends DCLogic {
  storeKey() { return 'riva.bellano.v1'; }
  catalog() {
    return [
      { id: 'welcome', name: 'Arrived', how: 'Open Riva in Bellano', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z M12 11.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z' },
      { id: 'orrido', name: 'Orrido', how: 'Open all three Orrido tabs', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z M12 15a3 3 0 100-6 3 3 0 000 6z' },
      { id: 'table', name: 'At the table', how: 'Open all three Eat tabs', color: '#C1633B', tint: '#FBEDE6', glyph: 'M6 3v8a2 2 0 002 2h0a2 2 0 002-2V3M8 13v8M17 3c-1.7 0-3 2-3 5s1.3 5 3 5m0-10v18' },
      { id: 'pin', name: 'Follow the pin', how: 'Tap a pin for directions', color: '#C1633B', tint: '#FBEDE6', glyph: 'M3 11l19-9-9 19-2-8-8-2z' },
      { id: 'checkin', name: 'Check-in', how: 'Say how you got here', color: '#C1633B', tint: '#FBEDE6', glyph: 'M9 12l2 2 4-4 M12 21a9 9 0 100-18 9 9 0 000 18z' },
      { id: 'slow', name: 'Slow traveller', how: 'Arrive by train or boat', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M11 20A7 7 0 019.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12' },
      { id: 'meet', name: 'Meet', how: 'Open all three Meet tabs', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75' },
      { id: 'street', name: 'Street', how: 'Open all three Street tabs', color: '#C1633B', tint: '#FBEDE6', glyph: 'M12 22a10 10 0 100-20 10 10 0 000 20z M12 6v6l4 2' }
    ];
  }
  readStore() {
    var raw = null;
    try { raw = window.localStorage.getItem(this.storeKey()); } catch (e) {}
    if (!raw) { try { raw = window.__rivaMem || null; } catch (e) {} }
    var data = null;
    try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
    if (!data || typeof data !== 'object') data = {};
    if (!Array.isArray(data.stamps)) data.stamps = [];
    if (!data.tabs || typeof data.tabs !== 'object') data.tabs = {};
    return data;
  }
  writeStore(data) {
    var raw = JSON.stringify(data);
    try { window.__rivaMem = raw; } catch (e) {}
    try { window.localStorage.setItem(this.storeKey(), raw); } catch (e) {}
  }
  award(ids) {
    var d = this.readStore();
    var added = [];
    ids.forEach(function (id) {
      if (d.stamps.indexOf(id) < 0) { d.stamps.push(id); added.push(id); }
    });
    if (added.length) this.writeStore(d);
    return added;
  }
  celebrate(ids) {
    var self = this;
    var cat = this.catalog();
    var picked = ids.map(function (id) { return cat.filter(function (s) { return s.id === id; })[0]; });
    var have = this.readStore().stamps;
    var earnable = cat.filter(function (s) { return !s.soon; });
    var n = earnable.filter(function (s) { return have.indexOf(s.id) >= 0; }).length;
    this.setState({ toast: { title: picked.map(function (s) { return s.name; }).join(' + '), glyph: picked[0].glyph, count: n + ' of ' + earnable.length } });
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(function () { self.setState({ toast: null }); }, 4200);
  }
  noteTab(name) {
    var d = this.readStore();
    var seen = d.tabs.orrido || [];
    if (seen.indexOf(name) < 0) { seen.push(name); d.tabs.orrido = seen; this.writeStore(d); }
    if (seen.length >= 3) {
      var added = this.award(['orrido']);
      if (added.length) this.celebrate(added);
    }
  }

  constructor(props) {
    super(props);
    this.state = { tab: 'overview', toast: null, transport: this.readStore().transport || null };
  }
  componentDidMount() {
    this.noteTab('overview');
  }
  componentWillUnmount() {
    clearTimeout(this.toastTimer);
  }
  go(name) {
    this.setState({ tab: name });
    this.noteTab(name);
  }
  pick(mode) {
    var d = this.readStore();
    d.transport = mode;
    this.writeStore(d);
    var ids = ['checkin'];
    if (mode === 'train' || mode === 'boat') ids.push('slow');
    var added = this.award(ids);
    this.setState({ transport: mode });
    if (added.length) this.celebrate(added);
  }
  pillStyle(name) {
    var active = this.state.tab === name;
    var base = 'flex:1;text-align:center;padding:9px 0;border-radius:10px;font-size:12.5px;font-weight:600;border:none;';
    return active
      ? base + 'background:#2F6F6A;color:#F4EFE6;'
      : base + 'background:transparent;color:rgba(28,38,32,0.55);';
  }
  chipStyle(mode) {
    var on = this.state.transport === mode;
    var base = "flex:1;padding:10px 0;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;";
    return on
      ? base + 'background:#2F6F6A;color:#F4EFE6;border:1px solid #2F6F6A;'
      : base + 'background:#F4EFE6;color:#1C2620;border:1px solid rgba(28,38,32,0.14);';
  }
  renderVals() {
    var self = this;
    var tr = this.state.transport;
    var lines = {
      train: { line: '58% of visitors arrive by train, like you.', why: 'Counts like this help the Comune decide whether Bellano needs more trains in August.' },
      boat: { line: 'Only 9% of visitors arrive by boat — a small, scenic minority.', why: 'Counts like this help the Comune size the summer lake-boat schedule.' },
      car: { line: '33% of visitors arrive by car or bus.', why: 'Counts like this help the Comune plan parking and bus links for the busy summer weeks.' }
    };
    var cur = tr ? lines[tr] : { line: '', why: '' };
    var t = this.state.toast || { title: '', glyph: '', count: '' };
    return {
      tabIsOverview: this.state.tab === 'overview',
      tabIsPhotos: this.state.tab === 'photos',
      tabIsPractical: this.state.tab === 'practical',
      pillOverviewStyle: this.pillStyle('overview'),
      pillPhotosStyle: this.pillStyle('photos'),
      pillPracticalStyle: this.pillStyle('practical'),
      goOverview: function () { self.go('overview'); },
      goPhotos: function () { self.go('photos'); },
      goPractical: function () { self.go('practical'); },
      trainStyle: this.chipStyle('train'),
      boatStyle: this.chipStyle('boat'),
      carStyle: this.chipStyle('car'),
      pickTrain: function () { self.pick('train'); },
      pickBoat: function () { self.pick('boat'); },
      pickCar: function () { self.pick('car'); },
      hasTransport: !!tr,
      noTransport: !tr,
      transportLine: cur.line,
      transportWhy: cur.why,
      contextLine: 'Context · 7 in 10 Orrido visitors arrive before 11:00 — late afternoon is much calmer.',
      hasToast: !!this.state.toast,
      toastTitle: t.title,
      toastGlyph: t.glyph,
      toastCount: t.count
    };
  }
}

rivaMount({Component: Component});
(function(){var u=(window.RIVA_CONFIG||{}).feedbackUrl;if(u){var s=document.getElementById('fb');var a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.textContent='Give feedback';s.textContent=' · ';s.appendChild(a);}})();
</script>
</body>
</html>
