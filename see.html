<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bellano — See</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;background:#F4EFE6;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
  dl{margin:0;}
</style>

<style>#demo-note{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#1C2620;color:#F4EFE6;font:500 11.5px/1.35 'Space Grotesk',Helvetica,Arial,sans-serif;text-align:center;padding:7px 12px}#demo-note a{text-decoration:underline}body{padding-bottom:34px}</style>
</head>
<body>
<div id="riva-root"></div>
<div id="demo-note">Prototype for feedback · demo content: texts to be verified, photos are placeholders<span id="fb"></span></div>
<template id="riva-template">


<div style="width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:#F4EFE6;font-family:'Space Grotesk',Helvetica,Arial,sans-serif;color:#1C2620;display:flex;flex-direction:column;">

  <div role="status" aria-live="polite">
    <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
      <a href="passport.html" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:440px;z-index:50;display:flex;align-items:center;gap:12px;background:#1C2620;color:#F4EFE6;border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(28,38,32,0.28);">
        <div style="flex:0 0 38px;height:38px;border-radius:999px;border:2px solid #F4EFE6;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4EFE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{toastGlyph}}"/></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(244,239,230,0.6);">New stamp</div>
          <div style="font-size:14px;font-weight:600;margin-top:1px;">{{toastTitle}}</div>
        </div>
        <div style="flex:0 0 auto;font-size:12px;color:rgba(244,239,230,0.7);">{{toastCount}}</div>
      </a>
    </sc-if>
  </div>

  <div style="position:relative;height:220px;border-radius:0 0 20px 20px;overflow:hidden;background:linear-gradient(155deg,#3B564E 0%,#20302A 60%,#16211C 100%);display:flex;flex-direction:column;justify-content:space-between;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0;">
      <a href="index.html" aria-label="Back to Bellano overview" style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;background:rgba(244,239,230,0.16);color:#F4EFE6;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div style="color:rgba(244,239,230,0.6);font-size:10.5px;text-align:right;line-height:1.4;">[PHOTO<br>suspended walkway]</div>
    </div>
    <div style="padding:0 20px 20px;">
      <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(244,239,230,0.6);">See · Bellano</div>
      <div style="font-family:'Instrument Serif',Georgia,serif;font-size:32px;line-height:1;color:#F4EFE6;margin-top:4px;">What to see in Bellano</div>
    </div>
  </div>

  <div style="display:flex;gap:4px;background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:4px;margin:16px 20px 4px;">
    <button type="button" style="{{pillOverviewStyle}}" onClick="{{goOverview}}">Overview</button>
    <button type="button" style="{{pillPhotosStyle}}" onClick="{{goPhotos}}">Photos</button>
    <button type="button" style="{{pillWalkStyle}}" onClick="{{goWalk}}">Walk</button>
  </div>

  <div style="padding:14px 20px 32px;flex:1;">

    <sc-if value="{{tabIsOverview}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <p style="font-size:13.5px;line-height:1.55;margin:0 0 2px;color:rgba(28,38,32,0.7);">Bellano is small and most of it is on foot. These are the places worth your time.</p>
        <div style="background:#fff;border:1px solid #2F6F6A;border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;"><div style="font-size:16px;font-weight:600;">Orrido di Bellano</div><span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Start here</span></div>
              <div style="font-size:13.5px;line-height:1.55;margin-top:6px;">The Pioverna stream carved this narrow gorge over roughly 15 million years, and it sits right in Bellano — suspended walkways let you walk the ravine itself, past rock walls, plunge pools and waterfalls, in about 30 minutes.</div>
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Orrido%20di%20Bellano%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" title="Orrido di Bellano" aria-label="Get directions to Orrido di Bellano" style="flex:0 0 30px;height:30px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);display:flex;align-items:center;justify-content:center;color:#1C2620;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg></a>
          </div>
          <details style="margin-top:10px;border-top:1px solid rgba(28,38,32,0.10);">
            <summary style="cursor:pointer;font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#2F6F6A;padding:10px 0 2px;">Practical</summary>
            <dl style="margin:0;display:flex;flex-direction:column;">
            <div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(28,38,32,0.10);"><dt style="font-size:12.5px;color:rgba(28,38,32,0.6);">Entry</dt><dd style="margin:0;font-size:13px;font-weight:600;text-align:right;">[price to confirm]</dd></div>
            <div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(28,38,32,0.10);"><dt style="font-size:12.5px;color:rgba(28,38,32,0.6);">Visit length</dt><dd style="margin:0;font-size:13px;font-weight:600;text-align:right;">About 30 minutes</dd></div>
            <div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(28,38,32,0.10);"><dt style="font-size:12.5px;color:rgba(28,38,32,0.6);">Season</dt><dd style="margin:0;font-size:13px;font-weight:600;text-align:right;">Year-round, limited hours in winter</dd></div>
            <div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(28,38,32,0.10);"><dt style="font-size:12.5px;color:rgba(28,38,32,0.6);">Best time</dt><dd style="margin:0;font-size:13px;font-weight:600;text-align:right;">Late afternoon is calmer<span style="display:block;font-size:11.5px;font-weight:400;color:rgba(28,38,32,0.55);margin-top:2px;">7 in 10 visitors arrive before 11:00 · demo figure</span></dd></div>
            <div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(28,38,32,0.10);"><dt style="font-size:12.5px;color:rgba(28,38,32,0.6);">Suitable for</dt><dd style="margin:0;font-size:13px;font-weight:600;text-align:right;">Families with children</dd></div>
            <div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;"><dt style="font-size:12.5px;color:rgba(28,38,32,0.6);">From the station</dt><dd style="margin:0;font-size:13px;font-weight:600;text-align:right;">[distance to confirm]</dd></div>
            </dl>
          </details>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-left:3px solid #C1633B;border-radius:12px;padding:14px 16px;">
          <div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#C1633B;">17th-century local colour</div>
          <div style="font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:17px;line-height:1.4;margin-top:6px;">"Orrore di un'orrenda orrendezza"</div>
          <div style="font-size:12px;color:rgba(28,38,32,0.6);margin-top:6px;">— Sigismondo Boldoni, 17th-century physician, philosopher and poet from Bellano, on the gorge.</div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;"><div style="font-size:15px;font-weight:600;">Ca' del Diavol</div><span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Gorge entrance</span></div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">The tower at the gorge entrance, now a multimedia centre with VR installations on the story of the stream. The legend behind its name is in Meet › Stories.</div>
            </div>
            
          </div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;"><div style="font-size:15px;font-weight:600;">The old centre</div><span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Old town</span></div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">A well-preserved old town, with alleys that run down to the water and few shops.</div>
            </div>
            
          </div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;"><div style="font-size:15px;font-weight:600;">The lakefront</div><span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Lake</span></div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">The promenade where most of the town's bars, restaurants and cafés are. In summer there is a paid lido and a small free public beach.</div>
            </div>
            
          </div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;"><div style="font-size:15px;font-weight:600;">Monumento a Tommaso Grossi</div><span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Monument</span></div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">A white marble monument to the poet on the lakefront, inaugurated in 1876 and made by Antonio Tantardini. The inscription is signed by Alessandro Manzoni.</div>
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Monumento%20a%20Tommaso%20Grossi%2C%20Viale%20Tommaso%20Grossi%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" title="Monumento a Tommaso Grossi" aria-label="Get directions to Monumento a Tommaso Grossi" style="flex:0 0 30px;height:30px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);display:flex;align-items:center;justify-content:center;color:#1C2620;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg></a>
          </div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;"><div style="font-size:15px;font-weight:600;">Santi Nazaro e Celso</div><span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Church</span></div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Piazza San Giorgio. A National Monument: a 14th-century Gothic church with a façade of black and white marble bands, a rose window decorated in majolica terracotta and 15th–16th-century frescoes inside.</div>
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Chiesa%20dei%20Santi%20Nazaro%20e%20Celso%2C%20Piazza%20San%20Giorgio%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" title="Chiesa dei Santi Nazaro e Celso" aria-label="Get directions to Chiesa dei Santi Nazaro e Celso" style="flex:0 0 30px;height:30px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);display:flex;align-items:center;justify-content:center;color:#1C2620;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg></a>
          </div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;"><div style="font-size:15px;font-weight:600;">Chiesa di Santa Marta</div><span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Church</span></div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Piazza Santa Marta. Holds the <em>Compianto sul Cristo morto</em>, eight painted wooden statues from the late 1400s, attributed to Giovanni Angelo del Maino.</div>
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Chiesa%20di%20Santa%20Marta%2C%20Piazza%20Santa%20Marta%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" title="Chiesa di Santa Marta" aria-label="Get directions to Chiesa di Santa Marta" style="flex:0 0 30px;height:30px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);display:flex;align-items:center;justify-content:center;color:#1C2620;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg></a>
          </div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;"><div style="font-size:15px;font-weight:600;">Chiesa di San Rocco</div><span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Chapel</span></div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">A 15th-century chapel later given 18th-century styling, turned into a memorial to the war dead in 1969. Two First World War bombs stand at the entrance.</div>
            </div>
            
          </div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;"><div style="font-size:15px;font-weight:600;">Museo Giancarlo Vitali</div><span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Museum</span></div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Via Manzoni 50, on the ground floor of Palazzo Lorla. Over 100 paintings by Giancarlo Vitali, set up by the Comune together with the association ArchiViVitali.</div>
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Museo%20Giancarlo%20Vitali%2C%20Via%20Manzoni%2050%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" title="Museo Giancarlo Vitali" aria-label="Get directions to Museo Giancarlo Vitali" style="flex:0 0 30px;height:30px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);display:flex;align-items:center;justify-content:center;color:#1C2620;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg></a>
          </div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;"><div style="font-size:15px;font-weight:600;">San Nicolao Arte Contemporanea</div><span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Gallery</span></div>
              <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Via San Nicolao 9. Contemporary art exhibitions on the ground floor and, upstairs, the permanent collection of Danilo Vitali.</div>
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=San%20Nicolao%20Arte%20Contemporanea%2C%20Via%20San%20Nicolao%209%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" title="San Nicolao Arte Contemporanea" aria-label="Get directions to San Nicolao Arte Contemporanea" style="flex:0 0 30px;height:30px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);display:flex;align-items:center;justify-content:center;color:#1C2620;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg></a>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{tabIsPhotos}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div>
          <div style="height:150px;border-radius:14px;background:linear-gradient(160deg,#2F6F6A,#1C2620);display:flex;align-items:center;justify-content:center;color:rgba(244,239,230,0.6);font-size:11px;text-align:center;">[PHOTO<br>walkway over the gorge]</div>
          <div style="font-size:11.5px;color:rgba(28,38,32,0.55);margin-top:6px;">The suspended walkways inside the gorge.</div>
        </div>
        <div>
          <div style="height:150px;border-radius:14px;background:linear-gradient(160deg,#C1633B,#5C2C18);display:flex;align-items:center;justify-content:center;color:rgba(244,239,230,0.6);font-size:11px;text-align:center;">[PHOTO<br>waterfall &amp; plunge pool]</div>
          <div style="font-size:11.5px;color:rgba(28,38,32,0.55);margin-top:6px;">Plunge pools and waterfalls carved by the Pioverna.</div>
        </div>
        <div>
          <div style="height:150px;border-radius:14px;background:linear-gradient(160deg,#3B564E,#16211C);display:flex;align-items:center;justify-content:center;color:rgba(244,239,230,0.6);font-size:11px;text-align:center;">[PHOTO<br>Ca' del Diavol]</div>
          <div style="font-size:11.5px;color:rgba(28,38,32,0.55);margin-top:6px;">The Ca' del Diavol at the gorge entrance.</div>
        </div>
        <div>
          <div style="height:150px;border-radius:14px;background:linear-gradient(160deg,#35566B,#121D24);display:flex;align-items:center;justify-content:center;color:rgba(244,239,230,0.6);font-size:11px;text-align:center;">[PHOTO<br>lakefront]</div>
          <div style="font-size:11.5px;color:rgba(28,38,32,0.55);margin-top:6px;">The lakefront promenade.</div>
        </div>
        <div>
          <div style="height:150px;border-radius:14px;background:linear-gradient(160deg,#47615A,#1A2420);display:flex;align-items:center;justify-content:center;color:rgba(244,239,230,0.6);font-size:11px;text-align:center;">[PHOTO<br>Santi Nazaro e Celso]</div>
