<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bellano — Street</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;background:#F4EFE6;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
</style>

<style>#demo-note{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#1C2620;color:#F4EFE6;font:500 11.5px/1.35 'Space Grotesk',Helvetica,Arial,sans-serif;text-align:center;padding:7px 12px}#demo-note a{text-decoration:underline}body{padding-bottom:34px}</style>
</head>
<body>
<div id="riva-root"></div>
<div id="demo-note">Prototype for feedback · demo content: texts to be verified, photos are placeholders<span id="fb"></span></div>
<template id="riva-template">


<div style="width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:#F4EFE6;font-family:'Space Grotesk',Helvetica,Arial,sans-serif;color:#1C2620;display:flex;flex-direction:column;">

  <div role="status" aria-live="polite">
    <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
      <a href="passport.html" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:440px;z-index:50;display:flex;align-items:center;gap:12px;background:#1C2620;color:#F4EFE6;border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(28,38,32,0.28);">
        <div style="flex:0 0 38px;height:38px;border-radius:999px;border:2px solid #F4EFE6;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4EFE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{toastGlyph}}"/></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(244,239,230,0.6);">New stamp</div>
          <div style="font-size:14px;font-weight:600;margin-top:1px;">{{toastTitle}}</div>
        </div>
        <div style="flex:0 0 auto;font-size:12px;color:rgba(244,239,230,0.7);">{{toastCount}}</div>
      </a>
    </sc-if>
  </div>

  <div style="position:relative;height:220px;border-radius:0 0 20px 20px;overflow:hidden;background:linear-gradient(155deg,#35566B 0%,#1F3441 60%,#121D24 100%);display:flex;flex-direction:column;justify-content:space-between;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0;">
      <a href="index.html" aria-label="Back to Bellano overview" style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;background:rgba(244,239,230,0.16);color:#F4EFE6;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div style="color:rgba(244,239,230,0.6);font-size:10.5px;text-align:right;line-height:1.4;">[PHOTO<br>Bellano pier]</div>
    </div>
    <div style="padding:0 20px 20px;">
      <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(244,239,230,0.6);">Street · Bellano</div>
      <div style="font-family:'Instrument Serif',Georgia,serif;font-size:30px;line-height:1;color:#F4EFE6;margin-top:4px;">Getting here, getting around</div>
    </div>
  </div>

  <div style="display:flex;gap:4px;background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:4px;margin:16px 20px 4px;">
    <button type="button" style="{{pillArriveStyle}}" onClick="{{goArrive}}">Arrive</button>
    <button type="button" style="{{pillAroundStyle}}" onClick="{{goAround}}">Around</button>
    <button type="button" style="{{pillPlanStyle}}" onClick="{{goPlan}}">Plan</button>
  </div>

  <div style="padding:14px 20px 32px;flex:1;">

    <sc-if value="{{tabIsArrive}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <p style="font-size:13.5px;line-height:1.55;margin:0 0 2px;color:rgba(28,38,32,0.7);">Three ways in.</p>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
            <div style="font-size:15px;font-weight:600;">By train</div><span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Slow traveller</span>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Regional trains run direct from Milano Centrale to Bellano-Tartavalle Terme on the Lecco–Tirano line, in about 1 h 10. Check the current timetable before you go.</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"><a href="https://www.google.com/maps/dir/?api=1&amp;destination=Stazione%20di%20Bellano-Tartavalle%20Terme%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" aria-label="Get directions to Bellano station" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);font-size:12px;font-weight:600;color:#1C2620;text-decoration:none;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>Bellano station</a></div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
            <div style="font-size:15px;font-weight:600;">By boat</div><span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Slow traveller</span>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Navigazione Laghi runs seasonal lake services that include Bellano, with excursions linking Como, Bellano and Bellagio. Dates and times change by season: [timetable to confirm].</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"><a href="https://www.google.com/maps/dir/?api=1&amp;destination=Imbarcadero%20di%20Bellano%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" aria-label="Get directions to Bellano pier" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);font-size:12px;font-weight:600;color:#1C2620;text-decoration:none;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>Bellano pier</a></div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
            <div style="font-size:15px;font-weight:600;">By car</div>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Bellano is on the SS36 Lecco–Colico road. Parking near the station is limited, so arrive early or leave the car elsewhere. [parking details to confirm]</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"><a href="https://www.google.com/maps/dir/?api=1&amp;destination=Parcheggio%20stazione%20di%20Bellano%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" aria-label="Get directions to Station car park" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);font-size:12px;font-weight:600;color:#1C2620;text-decoration:none;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>Station car park</a></div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#C1633B;">One tap</div>
            <div style="font-size:11px;color:rgba(28,38,32,0.45);">Earns a stamp</div>
          </div>
          <div style="font-size:14.5px;font-weight:600;margin-top:6px;">How did you get to Bellano?</div>
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button type="button" style="{{trainStyle}}" onClick="{{pickTrain}}">Train</button>
            <button type="button" style="{{boatStyle}}" onClick="{{pickBoat}}">Boat</button>
            <button type="button" style="{{carStyle}}" onClick="{{pickCar}}">Car or bus</button>
          </div>
          <sc-if value="{{noTransport}}" hint-placeholder-val="{{true}}">
            <div style="font-size:11.5px;line-height:1.5;color:rgba(28,38,32,0.5);margin-top:10px;">Why we ask: pooled with other visitors, it helps the Comune plan transport.</div>
          </sc-if>
          <sc-if value="{{hasTransport}}" hint-placeholder-val="{{false}}">
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(28,38,32,0.10);">
              <div style="font-size:14px;font-weight:600;line-height:1.4;">{{transportLine}}</div>
              <div style="font-size:12.5px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:4px;">{{transportWhy}}</div>
              <div style="font-size:10.5px;color:rgba(28,38,32,0.4);margin-top:8px;">Demo figures — placeholders until real visit counts exist.</div>
            </div>
          </sc-if>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{tabIsAround}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <p style="font-size:13.5px;line-height:1.55;margin:0 0 2px;color:rgba(28,38,32,0.7);">The town is small enough to see on foot. The lake and the hills are the only reason to go further.</p>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
            <div style="font-size:15px;font-weight:600;">On foot in town</div>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">The BAC route links the gorge, the museums and the churches. See › Walk for the five stops with directions.</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"><a href="https://www.google.com/maps/dir/?api=1&amp;destination=Orrido%20di%20Bellano%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" aria-label="Get directions to Orrido" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);font-size:12px;font-weight:600;color:#1C2620;text-decoration:none;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>Orrido</a></div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
            <div style="font-size:15px;font-weight:600;">Sentiero del Viandante</div><span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Hike</span>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">The stage from Dervio through Bellano (past the Orrido) to Varenna is about 12 km, roughly 5 hours without stops, with about 620 m of climbing. The path is part of the Cammini d'Italia network and marked with orange plates.</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"><a href="https://www.google.com/maps/dir/?api=1&amp;destination=Stazione%20di%20Dervio%2C%20Dervio%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" aria-label="Get directions to Dervio station" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);font-size:12px;font-weight:600;color:#1C2620;text-decoration:none;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>Dervio station</a><a href="https://www.google.com/maps/dir/?api=1&amp;destination=Varenna%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" aria-label="Get directions to Varenna" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);font-size:12px;font-weight:600;color:#1C2620;text-decoration:none;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>Varenna</a></div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
            <div style="font-size:15px;font-weight:600;">To Varenna by train</div>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Trains from Bellano reach Varenna in 4–6 minutes: an easy way to shorten or end the hike.</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"><a href="https://www.google.com/maps/dir/?api=1&amp;destination=Stazione%20di%20Varenna-Esino%2C%20Varenna%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" aria-label="Get directions to Varenna station" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);font-size:12px;font-weight:600;color:#1C2620;text-decoration:none;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>Varenna station</a></div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{tabIsPlan}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <p style="font-size:13.5px;line-height:1.55;margin:0 0 2px;color:rgba(28,38,32,0.7);">A simple way to put it together.</p>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
            <div style="font-size:15px;font-weight:600;">A half day, with Varenna</div>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Spend the morning in Bellano (gorge, old town, lunch), then take the short train to Varenna for Villa Monastero or the Castello di Vezio.</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"><a href="https://www.google.com/maps/dir/?api=1&amp;destination=Orrido%20di%20Bellano%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" aria-label="Get directions to Orrido" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);font-size:12px;font-weight:600;color:#1C2620;text-decoration:none;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>Orrido</a><a href="https://www.google.com/maps/dir/?api=1&amp;destination=Villa%20Monastero%2C%20Varenna%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" aria-label="Get directions to Villa Monastero" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);font-size:12px;font-weight:600;color:#1C2620;text-decoration:none;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>Villa Monastero</a><a href="https://www.google.com/maps/dir/?api=1&amp;destination=Castello%20di%20Vezio%2C%20Perledo%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" aria-label="Get directions to Castello di Vezio" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);font-size:12px;font-weight:600;color:#1C2620;text-decoration:none;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>Castello di Vezio</a></div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
            <div style="font-size:15px;font-weight:600;">Check the calendar</div><span style="font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#2F6F6A;">Before you go</span>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Pesa Vegia is on January 5. The Orrido has seasonal opening and limited hours in winter, so check before you travel.</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"><a href="https://www.google.com/maps/dir/?api=1&amp;destination=Orrido%20di%20Bellano%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" aria-label="Get directions to Orrido" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);font-size:12px;font-weight:600;color:#1C2620;text-decoration:none;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>Orrido</a></div>
        </div>
        <div style="background:#fff;border:1px solid rgba(28,38,32,0.10);border-radius:14px;padding:14px 16px;">
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
            <div style="font-size:15px;font-weight:600;">Leave the car</div>
          </div>
          <div style="font-size:13px;line-height:1.5;color:rgba(28,38,32,0.65);margin-top:5px;">Parking near the station is limited. The train and the boat both arrive within walking distance of the old town. [to confirm on site]</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"><a href="https://www.google.com/maps/dir/?api=1&amp;destination=Parcheggio%20stazione%20di%20Bellano%2C%20Bellano%20LC%2C%20Italy" target="_blank" rel="noopener" onClick="{{onPin}}" aria-label="Get directions to Station car park" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#F4EFE6;border:1px solid rgba(28,38,32,0.14);font-size:12px;font-weight:600;color:#1C2620;text-decoration:none;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>Station car park</a></div>
        </div>
      </div>
    </sc-if>

  </div>

  <div style="padding:0 20px 26px;">
    <div style="font-size:11px;color:rgba(28,38,32,0.4);border-top:1px solid rgba(28,38,32,0.10);padding-top:12px;">Compiled from public tourism sources — to be verified on site before launch.</div>
  </div>

</div>
</template>
<script src="riva-runtime.js"></script>
<script src="config.js"></script>
<script>

class Component extends DCLogic {
  storeKey() { return 'riva.bellano.v1'; }
  catalog() {
    return [
      { id: 'welcome', name: 'Arrived', how: 'Open Riva in Bellano', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M12 22s8-7.58 8-13a8 8 0 10-16 0c0 5.42 8 13 8 13z M12 11.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z' },
      { id: 'see', name: 'See', how: 'Open all three See tabs', color: '#2F6F6A', tint: '#EAF2F1', glyph: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z M12 15a3 3 0 100-6 3 3 0 000 6z' },

  readStore() {
    var raw = null;
    try { raw = window.localStorage.getItem(this.storeKey()); } catch (e) {}
    if (!raw) { try { raw = window.__rivaMem || null; } catch (e) {} }
    var data = null;
    try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
    if (!data || typeof data !== 'object') data = {};
    if (!Array.isArray(data.stamps)) data.stamps = [];
    if (!data.tabs || typeof data.tabs !== 'object') data.tabs = {};
    return data;
  }
  writeStore(data) {
    var raw = JSON.stringify(data);
    try { window.__rivaMem = raw; } catch (e) {}
    try { window.localStorage.setItem(this.storeKey(), raw); } catch (e) {}
  }
  award(ids) {
    var d = this.readStore();
    var added = [];
    ids.forEach(function (id) {
      if (d.stamps.indexOf(id) < 0) { d.stamps.push(id); added.push(id); }
    });
    if (added.length) this.writeStore(d);
    return added;
  }
  celebrate(ids) {
    var self = this;
    var cat = this.catalog();
    var picked = ids.map(function (id) { return cat.filter(function (s) { return s.id === id; })[0]; });
    var have = this.readStore().stamps;
    var earnable = cat.filter(function (s) { return !s.soon; });
    var n = earnable.filter(function (s) { return have.indexOf(s.id) >= 0; }).length;
    this.setState({ toast: { title: picked.map(function (s) { return s.name; }).join(' + '), glyph: picked[0].glyph, count: n + ' of ' + earnable.length } });
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(function () { self.setState({ toast: null }); }, 4200);
  }
  noteTab(name) {
    var d = this.readStore();
    var seen = d.tabs.street || [];
    if (seen.indexOf(name) < 0) { seen.push(name); d.tabs.street = seen; this.writeStore(d); }
    if (seen.length >= 3) {
      var added = this.award(['street']);
      if (added.length) this.celebrate(added);
    }
  }

  constructor(props) {
    super(props);
    this.state = { tab: 'arrive', toast: null, transport: this.readStore().transport || null };
  }
  componentDidMount() {
    this.noteTab('arrive');
  }
  componentWillUnmount() {
    clearTimeout(this.toastTimer);
  }
  go(name) {
    this.setState({ tab: name });
    this.noteTab(name);
  }
  pick(mode) {
    var d = this.readStore();
    d.transport = mode;
    this.writeStore(d);
    var ids = ['checkin'];
    if (mode === 'train' || mode === 'boat') ids.push('slow');
    var added = this.award(ids);
    this.setState({ transport: mode });
    if (added.length) this.celebrate(added);
  }
  chipStyle(mode) {
    var on = this.state.transport === mode;
    var base = "flex:1;padding:10px 0;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;";
    return on
      ? base + 'background:#C1633B;color:#F4EFE6;border:1px solid #C1633B;'
      : base + 'background:#F4EFE6;color:#1C2620;border:1px solid rgba(28,38,32,0.14);';
  }
  pillStyle(name) {
    var active = this.state.tab === name;
    var base = 'flex:1;text-align:center;padding:9px 0;border-radius:10px;font-size:12.5px;font-weight:600;border:none;';
    return active
      ? base + 'background:#C1633B;color:#F4EFE6;'
      : base + 'background:transparent;color:rgba(28,38,32,0.55);';
  }
  renderVals() {
    var self = this;
    var tr = this.state.transport;
    var lines = {
      train: { line: '58% of visitors arrive by train, like you.', why: 'Counts like this help the Comune decide whether Bellano needs more trains in August.' },
      boat: { line: 'Only 9% of visitors arrive by boat — a small, scenic minority.', why: 'Counts like this help the Comune size the summer lake-boat schedule.' },
      car: { line: '33% of visitors arrive by car or bus.', why: 'Counts like this help the Comune plan parking and bus links for the busy summer weeks.' }
    };
    var cur = tr ? lines[tr] : { line: '', why: '' };
    var t = this.state.toast || { title: '', glyph: '', count: '' };
    return {
      trainStyle: this.chipStyle('train'),
      boatStyle: this.chipStyle('boat'),
      carStyle: this.chipStyle('car'),
      pickTrain: function () { self.pick('train'); },
      pickBoat: function () { self.pick('boat'); },
      pickCar: function () { self.pick('car'); },
      hasTransport: !!tr,
      noTransport: !tr,
      transportLine: cur.line,
      transportWhy: cur.why,
      onPin: function () {
        var added = self.award(['pin']);
        if (added.length) self.celebrate(added);
      },
      tabIsArrive: this.state.tab === 'arrive',
      tabIsAround: this.state.tab === 'around',
      tabIsPlan: this.state.tab === 'plan',
      pillArriveStyle: this.pillStyle('arrive'),
      pillAroundStyle: this.pillStyle('around'),
      pillPlanStyle: this.pillStyle('plan'),
      goArrive: function () { self.go('arrive'); },
      goAround: function () { self.go('around'); },
      goPlan: function () { self.go('plan'); },
      hasToast: !!this.state.toast,
      toastTitle: t.title,
      toastGlyph: t.glyph,
      toastCount: t.count
    };
  }
}
